name: Deploy to GitHub Pages

on:
  # Deploy on every push to main. Change this if you deploy from another branch.
  push:
    branches: [main]
  # Allow a manual run from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer commit supersede an in-flight deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install, build and upload
        uses: withastro/action@v6
        env:
          SITE_URL: https://mantou-fw.github.io
          SITE_BASE: /faith-about

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5